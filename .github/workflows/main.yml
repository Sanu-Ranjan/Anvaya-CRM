name: Deploy to VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            source ~/.nvm/nvm.sh
            set -e
            cd /root/neog-Major-Project-2
            git checkout main && git pull
            cd server
            npm i
            pm2 restart anvaya-backend
            pm2 save
            cd /root/neog-Major-Project-2/client
            npm i
            npm run build
